<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI콘텐츠 활용이 막막한 사람들을 위한 필독서 (강의용)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:hsl(222,47%,6%);
    --sidebar-bg:hsl(222,40%,9%);
    --text:hsl(0,0%,95%);
    --text-sub:hsl(215,20%,70%);
    --text-muted:hsl(215,12%,50%);
    --accent:hsl(210,95%,60%);
    --border:hsla(222,30%,25%,0.35);

    --slide-bg:#fff;
    --slide-text:#1a1a1a;
    --slide-text-sub:#4a4a4a;
    --slide-muted:#9a9a9a;
    --slide-link:#3d7ad9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR','Outfit',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;min-height:100vh;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:hsl(222,25%,22%);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  /* Sidebar */
  .sidebar{
    width:300px;background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    position:fixed;top:0;bottom:0;left:0;
    display:flex;flex-direction:column;z-index:100;
    box-shadow:8px 0 30px rgba(0,0,0,0.35);
  }
  .brand{padding:22px 20px;border-bottom:1px solid var(--border)}
  .brand-badge{
    display:inline-block;font-size:10px;letter-spacing:0.15em;
    color:var(--accent);background:hsla(210,95%,60%,0.12);
    padding:4px 10px;border-radius:99px;margin-bottom:10px;font-weight:500;
  }
  .brand-title{font-size:15px;font-weight:700;line-height:1.4}
  .brand-sub{font-size:11px;color:var(--text-muted);margin-top:6px}
  .nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
  .nav-part{margin-top:14px}
  .nav-part:first-child{margin-top:4px}
  .part-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 10px;font-size:10px;letter-spacing:0.18em;
    font-weight:700;color:var(--accent);text-transform:uppercase;
  }
  .part-header .part-num{
    font-family:'Outfit',sans-serif;background:hsla(210,95%,60%,0.15);
    padding:2px 8px;border-radius:4px;font-weight:600;font-size:9px;
  }
  .nav-list{list-style:none}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;
    border-radius:7px;color:var(--text-sub);font-size:13px;
    cursor:pointer;transition:all 0.15s;border:1px solid transparent;
    line-height:1.35;
  }
  .nav-item:hover{background:hsla(210,95%,60%,0.06);color:var(--text)}
  .nav-item.active{
    background:hsla(210,95%,60%,0.15);color:var(--text);
    border-color:hsla(210,95%,60%,0.35);font-weight:500;
  }
  .nav-item .idx{
    font-family:'Outfit',sans-serif;font-size:10px;
    color:var(--text-muted);min-width:22px;
  }
  .nav-item.active .idx{color:var(--accent)}

  /* Main - slide viewport */
  .main{
    margin-left:300px;flex:1;padding:32px;
    min-height:100vh;
  }
  #content{
    width:100%;max-width:1280px;margin:0 auto;
  }
  .slide{
    width:100%;aspect-ratio:16/9;
    background:var(--slide-bg);color:var(--slide-text);
    border-radius:14px;overflow:hidden;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    font-family:'Noto Sans KR',sans-serif;
  }
  .slide-inner{
    position:absolute;inset:0;padding:60px 70px;
    display:flex;flex-direction:column;
  }
  .slide-footer{
    position:absolute;left:70px;right:70px;bottom:26px;
    display:flex;gap:32px;
    font-size:11px;color:var(--slide-muted);font-weight:500;
  }

  /* Editable text */
  .edit{
    outline:none;cursor:text;
    border:1px dashed transparent;border-radius:4px;
    padding:2px 6px;margin:-2px -6px;
    transition:background 0.12s,border-color 0.12s;
  }
  .edit:hover{background:hsla(210,95%,60%,0.06);border-color:hsla(210,95%,60%,0.3)}
  .edit:focus{background:hsla(210,95%,60%,0.1);border:1px solid var(--accent)}

  /* Cover slides */
  .slide.cover-slide{background:linear-gradient(135deg,#0a1a3d 0%,#1e3a8a 40%,#4a5fb8 75%,#c5b9ce 100%)}
  .slide.cover-slide::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 40%,transparent 0%,rgba(0,0,0,0.15) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/></svg>");
  }
  .cover-kicker{
    font-family:'Outfit',sans-serif;font-weight:800;
    font-size:5.5vw;letter-spacing:-0.02em;
    color:rgba(255,255,255,0.15);
    position:absolute;top:6vw;left:70px;right:0;line-height:1;
    white-space:nowrap;overflow:hidden;
  }
  .cover-title{
    position:relative;color:#fff;font-weight:800;
    font-size:44px;line-height:1.3;margin-top:auto;
  }
  .cover-sub{
    position:relative;color:rgba(255,255,255,0.85);
    font-size:15px;margin-top:16px;letter-spacing:0.03em;
  }
  .cover-logo{
    position:absolute;bottom:40px;left:70px;
    display:flex;align-items:center;gap:10px;
    color:#fff;font-size:20px;font-weight:600;
  }
  .cover-logo::before{
    content:"";width:22px;height:22px;background:#fff;
    border-radius:5px;transform:rotate(20deg);
  }

  /* Part cover */
  .part-cover.p1{background:linear-gradient(135deg,#0a1414 0%,#1a3d2b 50%,#88a642 100%)}
  .part-cover.p2{background:linear-gradient(135deg,#0d1c1e 0%,#1a4a52 50%,#4dd0ba 100%)}
  .part-cover.p3{background:linear-gradient(135deg,#0f0d1e 0%,#2a1f52 50%,#9e6dc2 100%)}
  .part-num-big{
    font-family:'Outfit',sans-serif;font-weight:800;
    color:rgba(255,255,255,0.25);font-size:64px;line-height:1;
    position:absolute;top:60px;left:70px;letter-spacing:-0.02em;
  }
  .part-title-big{
    position:absolute;bottom:120px;left:70px;
    color:#fff;font-weight:800;font-size:78px;line-height:1;
  }
  .part-desc{
    position:absolute;bottom:70px;left:70px;
    color:rgba(255,255,255,0.85);font-size:15px;
  }

  /* Common page heading */
  .page-h1{
    font-size:34px;font-weight:800;line-height:1.25;
    margin-bottom:14px;
  }
  .page-kicker{
    font-family:'Outfit',sans-serif;
    color:#d3d3d3;font-weight:800;font-size:48px;
    letter-spacing:-0.02em;line-height:1;margin-bottom:24px;
  }
  .page-h2{font-size:22px;font-weight:700;margin-bottom:14px}
  .page-p{font-size:14.5px;line-height:1.75;color:var(--slide-text);margin-bottom:12px}
  .page-p.muted{color:var(--slide-text-sub)}
  .page-p.small{font-size:13px}
  .link-blue{color:var(--slide-link);font-weight:600}

  ul.dots{list-style:none;margin:8px 0}
  ul.dots li{position:relative;padding-left:16px;line-height:1.75;font-size:14.5px;margin-bottom:4px}
  ul.dots li::before{content:"·";position:absolute;left:4px;font-weight:900}
  ol.nums{padding-left:22px;line-height:1.75;font-size:14.5px}
  ol.nums li{margin-bottom:4px}

  /* Two column layout (title left, content right) */
  .two-col{display:grid;grid-template-columns:1fr 1.15fr;gap:60px;flex:1;align-items:flex-start}
  .two-col.center-left{align-items:center}
  .two-col-left h1{font-size:52px;font-weight:800;line-height:1.15}
  .two-col-right{font-size:14.5px;line-height:1.75}
  .two-col-right h3{font-size:17px;font-weight:700;margin-bottom:14px}

  /* Image grids */
  .img-2x2{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:100%}
  .img-2x2 img{width:100%;height:100%;object-fit:cover;border-radius:4px;background:#eee}

  /* Case layout */
  .case-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;flex:1;align-items:center}
  .case-main-img{width:100%;height:auto;max-height:520px;object-fit:contain;background:#f7f7f7;border-radius:4px}
  .case-body h3{font-size:22px;font-weight:800;margin-bottom:14px}
  .case-body .kv{font-size:14px;margin-bottom:10px;color:var(--slide-text)}
  .case-body .kv b{font-weight:700}
  .case-body h4{font-size:14.5px;font-weight:700;margin:16px 0 8px}
  .case-body .refs{display:flex;gap:8px;margin:8px 0 12px}
  .case-body .refs img{width:100px;height:100px;object-fit:cover;border-radius:4px;background:#f2f2f2}
  .case-body p.prompt-user{font-size:13px;line-height:1.7;color:#4a4a4a}
  .case-body p.prompt-ai{font-size:12.5px;line-height:1.65;color:#4a4a4a}

  /* Terms 4-col */
  .terms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:36px 30px;flex:1;align-content:center;margin-top:12px}
  .term h4{font-size:14.5px;font-weight:800;margin-bottom:8px}
  .term p{font-size:12.5px;line-height:1.65;color:var(--slide-text-sub)}

  /* Models 4-col */
  .models-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;flex:1;margin-top:20px}
  .model-col h4{font-size:14.5px;font-weight:700;margin-bottom:20px}
  .model-col ul{list-style:none}
  .model-col li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
  .model-col .m-ico{
    width:22px;height:22px;border-radius:5px;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'Outfit',sans-serif;font-weight:700;font-size:11px;
    background:#f0f0f0;color:#333;flex-shrink:0;
  }
  .m-ico.g{background:linear-gradient(135deg,#4285f4,#ea4335,#fbbc05,#34a853);color:#fff}
  .m-ico.o{background:#000;color:#fff}
  .m-ico.x{background:#000;color:#fff}
  .m-ico.c{background:#d97757;color:#fff}
  .m-ico.s{background:linear-gradient(135deg,#3ab5b0,#5aca8d);color:#fff}
  .m-ico.mj{background:#000;color:#fff}
  .m-ico.f{background:#000;color:#fff}
  .m-ico.k{background:linear-gradient(135deg,#5ec4d1,#7a8ce8);color:#fff}
  .m-ico.r{background:#000;color:#fff}
  .m-ico.px{background:linear-gradient(135deg,#a459f7,#f2506d);color:#fff}
  .m-ico.su{background:#000;color:#fff}
  .m-ico.el{background:#000;color:#fff}

  /* Company case slide */
  .company-layout{display:grid;grid-template-columns:1fr 1.05fr;gap:50px;flex:1;align-items:stretch;min-height:0}
  .company-body{overflow:hidden}
  .company-body h1{font-size:26px;font-weight:800;margin-bottom:18px}
  .company-body .quote{font-size:15px;font-weight:700;margin-bottom:14px}
  .company-body p{font-size:13.5px;line-height:1.75;margin-bottom:12px;color:var(--slide-text)}
  .company-imgs{display:grid;gap:10px;height:100%;min-height:0}
  .company-imgs.g1{grid-template-columns:1fr;grid-template-rows:1fr}
  .company-imgs.g2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .company-imgs.g3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .company-imgs.g3 > :first-child{grid-column:1/3}
  .company-imgs.g-lside{grid-template-columns:1.15fr 1fr;grid-template-rows:1fr 1fr}
  .company-imgs.g-lside > :first-child{grid-row:1/3}
  .company-imgs.g-stack{grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr}
  .company-imgs.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .company-imgs img{width:100%;height:100%;object-fit:contain;border-radius:6px;background:#f5f5f5;min-height:0}

  /* Prompt structure */
  .prompt-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px 60px;flex:1;align-content:center;margin-top:20px}
  .prompt-box h4{font-size:16px;font-weight:800;margin-bottom:14px}
  .prompt-box .row{font-size:13px;line-height:1.7;color:var(--slide-text);margin-bottom:6px;position:relative;padding-left:14px}
  .prompt-box .row::before{content:"·";position:absolute;left:2px;font-weight:900}
  .prompt-box .row.eg{color:var(--slide-text-sub)}

  /* Callout / Growth closing */
  .growth-slide{background:linear-gradient(135deg,#0a1428 0%,#101d3a 60%,#1b2851 100%);color:#fff}
  .growth-title{text-align:center;font-size:34px;font-weight:800;margin-bottom:32px;color:#fff}
  .growth-body{max-width:820px;margin:0 auto;font-size:14.5px;line-height:1.85;color:rgba(255,255,255,0.92)}
  .growth-body strong{color:#fff}
  .growth-cta{
    display:inline-block;margin-top:28px;padding:12px 34px;
    background:var(--accent);color:#fff;border-radius:99px;
    font-weight:600;font-size:14px;text-decoration:none;
  }

  /* End slide */
  .end-slide{background:linear-gradient(135deg,#0a1a3d 0%,#1e3a8a 45%,#c5b9ce 100%);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .end-slide .logo{
    display:flex;align-items:center;gap:14px;
    font-size:44px;font-weight:600;color:#fff;
  }
  .end-slide .logo::before{
    content:"";width:44px;height:44px;background:#fff;
    border-radius:9px;transform:rotate(20deg);
  }
  .end-slide .tag{margin-top:10px;font-size:17px;color:rgba(255,255,255,0.85);font-weight:400}
  .end-slide .copyright{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,0.6);line-height:1.6}

  /* Menu toggle for mobile */
  .menu-toggle{display:none}
  @media(max-width:900px){
    .sidebar{transform:translateX(-100%);transition:transform 0.3s}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;padding:16px}
    .menu-toggle{
      display:block;position:fixed;top:12px;left:12px;z-index:150;
      background:var(--sidebar-bg);color:#fff;border:1px solid var(--border);
      padding:8px 12px;border-radius:6px;cursor:pointer;
    }
    .slide{aspect-ratio:auto;min-height:auto}
    .slide-inner{position:relative;padding:32px 28px}
    .cover-title,.part-title-big{font-size:32px}
    .part-num-big{font-size:36px;position:relative;top:auto;left:auto;margin-bottom:20px}
    .part-title-big,.part-desc{position:relative;bottom:auto;left:auto}
    .two-col,.case-layout,.company-layout,.prompt-grid,.terms-grid,.models-grid{grid-template-columns:1fr;gap:24px}
    .terms-grid,.models-grid{grid-template-columns:repeat(2,1fr)}
    .cover-kicker{position:relative;top:auto;left:auto;font-size:24px;margin-bottom:20px}
    .cover-title{margin-top:0}
    .slide-footer{position:relative;left:auto;right:auto;bottom:auto;margin-top:20px}
  }
</style>
</head>
<body>
<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<aside class="sidebar">
  <div class="brand">
    <span class="brand-badge">강의용 · 편집가능</span>
    <div class="brand-title">AI콘텐츠 활용이 막막한<br>사람들을 위한 필독서</div>
    <div class="brand-sub">기본 개념 · 모델 비교 · 프롬프트 · 기업 사례</div>
  </div>
  <nav class="nav" id="nav"></nav>
</aside>

<main class="main"><div id="content"></div></main>

<script>
const IMG = '필독서_assets/';
const F = '<div class="slide-footer"><span>AI콘텐츠 활용이 막막한 사람들을 위한 필독서</span><span>{PART}</span></div>';

const SLIDES = [
/* ==================== OVERVIEW ==================== */
{id:'cover',part:0,label:'표지',html:`

{id:'overview',part:0,label:'Overview · 들어가며',html:`

        <h3 class="edit" contenteditable="true">"창작에만 집중할 수 있도록"</h3>

      </div>

  </div></div>`},

{id:'agenda',part:0,label:'Agenda · 목차',html:`
  <div class="slide"><div class="slide-inner">
    <div class="page-kicker" contenteditable="true" style="margin-bottom:14px">Agenda</div>
    <div class="two-col center-left" style="gap:50px">
      <div class="two-col-left"><h1 class="edit" contenteditable="true">목차</h1></div>
      <div class="two-col-right" style="font-size:13px">
        <div style="margin-bottom:12px;border-bottom:1px solid #ddd;padding-bottom:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <h3 class="edit" contenteditable="true" style="font-size:15px">이해하기</h3>
            <span style="color:var(--slide-muted);font-size:12px">Part 1</span>
          </div>
          <ul class="dots" style="margin:2px 0">
            <li class="edit" contenteditable="true" style="font-size:13px;line-height:1.55;margin-bottom:1px">원활한 소통을 위한 기초 용어</li>
            <li class="edit" contenteditable="true" style="font-size:13px;line-height:1.55;margin-bottom:1px">주요 AI모델 한눈에 보기</li>

            <li class="edit" contenteditable="true" style="font-size:13px;line-height:1.55;margin-bottom:1px">일관성은 어떻게 유지하나요?</li>
            <li class="edit" contenteditable="true" style="font-size:13px;line-height:1.55;margin-bottom:1px">긴 영상은 어떻게 만드나요?</li>
          </ul>
        </div>
        <div style="margin-bottom:12px;border-bottom:1px solid #ddd;padding-bottom:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <h3 class="edit" contenteditable="true" style="font-size:15px">따라하기</h3>
            <span style="color:var(--slide-muted);font-size:12px">Part 2</span>

{id:'terms',part:1,label:'원활한 소통을 위한 기초 용어',html:`
  <div class="slide"><div class="slide-inner">
    <h1 class="page-h1 edit" contenteditable="true">원활한 소통을 위한 기초 용어</h1>
    <div class="terms-grid">
      <div class="term"><h4 class="edit" contenteditable="true">T2I (Text to Image)</h4><p class="edit" contenteditable="true">텍스트 프롬프트만으로 이미지를 생성하는 방식입니다. 모델마다 그림체가 달라, 다양하게 활용해보는 것이 좋습니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">I2I (Image to Image)</h4><p class="edit" contenteditable="true">이미지 인풋(레퍼런스)를 기반으로 이미지를 생성하는 방식입니다. 제품, 캐릭터, 배경, 스타일 등의 일관성을 유지하는 데 이용합니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">T2V (Text to Video)</h4><p class="edit" contenteditable="true">텍스트 프롬프트만으로 영상을 생성하는 방식입니다. 비주얼을 제어할 수 없어 주로 이용하지 않습니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">I2V (Image to Video)</h4><p class="edit" contenteditable="true">이미지를 움직이게 하는 방식으로, 주로 이용하는 생성 방식입니다. 장편의 영상을 만들 때는 컷별 이미지를 먼저 제작하고, I2V로 영상화한 다음, 편집 과정을 거칩니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">키프레임</h4><p class="edit" contenteditable="true">I2V의 일종으로, 첫 프레임과 마지막 프레임 이미지 2장을 인풋으로 넣어, 영상을 만드는 방식을 의미합니다. 의도를 가장 잘 구현할 수 있습니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">R2V (Reference to Video)</h4><p class="edit" contenteditable="true">가장 최신 방식으로 등장인물, 캐릭터, 장소, 음성 등의 인풋을 일관되게 유지하면서 멀티컷을 한번에 생성할 수 있습니다. 첫 프레임을 제작할 필요 없고, 가장 자연스럽다는 장점이 있습니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">네이티브 오디오</h4><p class="edit" contenteditable="true">오디오가 동시에 생성되어 높은 싱크로율을 보이는 영상 모델 기술을 의미합니다. 구글 Veo3가 처음 선보였으며, 최신 영상 모델들은 모두 탑재하고 있는 추세입니다.</p></div>
      <div class="term"><h4 class="edit" contenteditable="true">TTS (Text to Speech)</h4><p class="edit" contenteditable="true">텍스트를 음성으로 변환하는 기술을 의미합니다. 네이티브 오디오 전에는 TTS로 오디오를 생성한 후, 립싱크에 특화된 I2V 모델을 활용하는 방식으로 대화를 연출했습니다.</p></div>
    </div>
    ${F.replace('{PART}','Part 1.  이해하기')}
  </div></div>`},

{id:'consistency',part:1,label:'FAQ · 일관성 유지 방법',html:`
  <div class="slide"><div class="slide-inner">
    <div class="page-kicker" contenteditable="true">FAQ</div>
    <div class="two-col">
      <div class="two-col-left">
        <h1 class="edit" contenteditable="true" style="font-size:40px">일관성은 어떻게 유지하나요?</h1>
      </div>
      <div class="two-col-right">
        <h3 class="edit" contenteditable="true">"나노바나나 프로 4K가 가장 좋습니다"</h3>
        <p class="page-p edit" contenteditable="true">일관성 유지에 강점을 가진 모델은 다음과 같습니다.</p>
        <ul class="dots" style="margin:6px 0 12px 0">
          <li class="edit" contenteditable="true">NanoBanana Pro</li>
          <li class="edit" contenteditable="true">Seedream 4.5</li>
          <li class="edit" contenteditable="true">Flux 2</li>
          <li class="edit" contenteditable="true">Gpt Image 1.5</li>
        </ul>
        <p class="page-p edit" contenteditable="true">나노바나나 프로가 비용은 가장 비싸지만, 성능이 가장 좋습니다. <b>디테일이 중요한 제품 이미지의 경우, 나노바나나 프로 모델을 해상도 4K로 사용하면 가장 우수한 결과를 얻을 수 있으며, 인물/캐릭터 일관성은 다른 모델로도 충분히 구현이 가능합니다.</b> 하지만 나노바나나 프로 4K에서도 제품 상의 텍스트가 깨지는 현상이 여전히 발생할 수 있어 후보정 작업이 필요합니다.</p>
        <p class="page-p edit" contenteditable="true">참고로, 과거에는 일관성 유지를 위해 'LoRA' 등을 활용한 이미지 학습이 필요했지만, 현재는 모델의 발전으로, 단순 I2I 방식만으로도 충분히 구현이 가능합니다.</p>
      </div>
    </div>
    ${F.replace('{PART}','Part 1.  이해하기')}
  </div></div>`},

{id:'long-video',part:1,label:'FAQ · 긴 영상 만들기',html:`
  <div class="slide"><div class="slide-inner">
    <div class="page-kicker" contenteditable="true">FAQ</div>
    <div class="two-col">
      <div class="two-col-left">
        <h1 class="edit" contenteditable="true" style="font-size:40px">긴 영상은 어떻게 만드나요?</h1>
      </div>
      <div class="two-col-right">
        <h3 class="edit" contenteditable="true">"아직 한번에 생성하는 건 한계가 있습니다"</h3>
        <p class="page-p edit" contenteditable="true">다음 작업을 순차적으로 진행해야 합니다. (I2V 기준)</p>
        <ol class="nums" style="margin:8px 0 14px 0">
          <li class="edit" contenteditable="true">스토리보드 기획</li>
          <li class="edit" contenteditable="true">컷별 첫 프레임(이미지) 제작 — R2V에서는 캐릭터시트 제작으로 대체</li>
          <li class="edit" contenteditable="true">2번 결과물 영상화</li>
          <li class="edit" contenteditable="true">오디오 소스(내레이션, BGM, 효과음) 생성</li>
          <li class="edit" contenteditable="true">영상 편집 및 완성</li>
        </ol>
        <p class="page-p edit" contenteditable="true">AI 영상에서도 완성도를 위해서는 결국 <b>기획과 편집 역량이 중요</b>하며, AI로 생성하는 영상 1개의 컷 길이가 보통 5~10초 정도이므로 이를 고려한 기획이 필요합니다.</p>
        <p class="page-p edit" contenteditable="true">네이티브 오디오 기능이 탑재된 영상 모델이 등장하며 4번(오디오) 작업의 비중이 낮아질 것으로 보이며, 더 나아가 <b>최신 AI 에이전트가 복잡한 워크플로우를 하나의 인터페이스 안에서 통합해가고 있습니다.</b></p>
      </div>
    </div>
    ${F.replace('{PART}','Part 1.  이해하기')}
  </div></div>`},

{id:'commercial',part:1,label:'FAQ · 상업적 활용',html:`
  <div class="slide"><div class="slide-inner">
    <div class="page-kicker" contenteditable="true">FAQ</div>
    <div class="two-col">
      <div class="two-col-left">
        <h1 class="edit" contenteditable="true" style="font-size:40px">상업적으로 활용해도 되나요?</h1>
      </div>
      <div class="two-col-right">
        <h3 class="edit" contenteditable="true">"결과물이 유사하지 않으면 가능합니다"</h3>
        <p class="page-p edit" contenteditable="true"><b>현행 저작권법상 AI 산출물은 저작물로 인정되지 않아, 별도의 사용 허가 없이 광고·마케팅 소재로 활용할 수 있습니다.</b></p>
        <p class="page-p edit" contenteditable="true">학습 데이터의 저작권 침해를 걱정하시는 분들도 있는데요. 현재 관련 리스크는 AI 모델을 개발한 회사 차원에서 다뤄지고 있어, 일반적인 용도의 사용자는 크게 걱정하지 않으셔도 됩니다.</p>
        <p class="page-p edit" contenteditable="true"><b>다만, 결과물이 기존 저작물·인물·브랜드와 시각적으로 유사한 경우에는 문제가 될 수 있습니다.</b> 이는 AI 콘텐츠만의 문제가 아니라 모든 콘텐츠 제작에서 공통적으로 주의해야 할 사항이기도 합니다. 이미지 검색으로 유사성을 간단히 확인하는 습관을 들이는 것을 권장합니다.</p>
        <p class="page-p edit" contenteditable="true">마지막으로, <b>플랫폼마다 상업적 이용 허용 범위가 다를 수 있으니 사용 전 약관 확인이 필요합니다.</b></p>
      </div>
    </div>
    ${F.replace('{PART}','Part 1.  이해하기')}
  </div></div>`},

{id:'copyright',part:1,label:'FAQ · 저작권 주장',html:`
  <div class="slide"><div class="slide-inner">
    <div class="page-kicker" contenteditable="true">FAQ</div>
    <div class="two-col">
      <div class="two-col-left">
        <h1 class="edit" contenteditable="true" style="font-size:40px">저작권을 주장할 수 있나요?</h1>

      <div class="two-col-right">
        <h3 class="edit" contenteditable="true">"편집 작업이 더해지면 인정 받을 수 있습니다"</h3>
        <p class="page-p edit" contenteditable="true"><b>현행 저작권법상 AI가 단독으로 생성한 결과물은 저작물로 인정 받기 어렵습니다.</b> 저작권은 '인간의 창작적 표현'을 보호하는 제도이기 때문입니다.</p>
        <p class="page-p edit" contenteditable="true"><b>그러나 인간의 창작적 기여가 충분히 개입된 경우에는 가능합니다.</b> 국내에서는 'AI수로부인'이 시나리오 기획 및 영상 편집을 창작적 기여로 인정 받아, 최초로 편집저작물로 등록되었습니다.</p>
        <p class="page-p edit" contenteditable="true">이후 2025년 6월, 문화체육관광부·한국저작권위원회는 <span class="link-blue">「생성형 AI 활용 저작물의 저작권 등록 안내서」</span>를 공식 발표하며 등록 기준을 공식화했습니다. <b>안내서에서 제시한 인간의 창작적 기여 인정 기준은 다음 세 가지입니다.</b></p>
        <ul class="dots" style="margin:6px 0 12px 0">
          <li class="edit" contenteditable="true">자신의 저작물을 입력으로 활용한 경우</li>
          <li class="edit" contenteditable="true">단순 색 변경이나 텍스트 수정 이상의 후반작업이 더해진 경우</li>
          <li class="edit" contenteditable="true">여러 소스들을 배열하고 편집한 경우</li>
        </ul>
      </div>
    </div>
    ${F.replace('{PART}','Part 1.  이해하기')}
  </div></div>`},

{id:'prompt-structure',part:2,label:'기본 프롬프트 구조',html:`

      </div>

        <h4 class="edit" contenteditable="true">이미지 I2I</h4>

        <div class="row eg edit" contenteditable="true">예시: 원본의 인물 얼굴과 포즈는 유지, 배경을 복잡한 도심 야경으로 변경, 네온사인 조명 추가</div>

        <div class="row eg edit" contenteditable="true">예시: 38세 한국인 남성, 미니멀한 서재, 부드러운 간접 조명, 클로즈업, 35mm 필름 사진 스타일, 남자가 책장에 꽂힌 책등을 하나하나 훑으며 천천히 옆으로 걸어감. 부드러운 사이드 트래킹 샷, 고요하고 평화로운 분위기</div>

        <div class="row eg edit" contenteditable="true">예시: 말티즈가 꼬리를 흔들며 활기차게 짖음, 얼굴 쪽으로 천천히 줌인, 자연스러운 털의 움직임, 초근접 샷으로 종료</div>
      </div>
    </div>
    ${F.replace('{PART}','Part 2.  따라하기')}
  </div></div>`},

{id:'prompt-tips',part:2,label:'FAQ · 프롬프트 작성 팁',html:`
  <div class="slide"><div class="slide-inner">
    <div class="page-kicker" contenteditable="true">FAQ</div>
    <div class="two-col">
      <div class="two-col-left">
        <h1 class="edit" contenteditable="true" style="font-size:40px">프롬프트 작성 팁이 있나요?</h1>
      </div>
      <div class="two-col-right">
        <h3 class="edit" contenteditable="true">"레퍼런스를 찾아보세요"</h3>
        <p class="page-p edit" contenteditable="true">빈칸에서 처음부터 프롬프트를 작성하는 일은 어렵습니다. 대신 <b>비주얼 레퍼런스를 찾아본 뒤, LLM에게 '이 결과물을 얻기 위한 정교한 프롬프트를 작성해줘'라고 요청하면 우수한 프롬프트를 작성해줍니다.</b> 따라서 앞에서 본 기본 프롬프트 구조는 참고용으로만 알고 있어도 충분합니다.</p>
        <p class="page-p edit" contenteditable="true">나아가 요즘은 프롬프트 엔지니어링의 중요성 자체가 낮아지고 있습니다. 최신 AI들은 에이전트로 발전하면서 모호한 요청을 스스로 보완합니다. 즉, 간단하게 요청해도 결과물을 위한 복잡한 프롬프트를 대신 작성해 사용하는 것입니다.</p>
        <p class="page-p edit" contenteditable="true"><b>Part 2에 등장하는 모든 예시는 AI 에이전트로 제작한 것이며, 에이전트의 효용을 살펴보기 위해 각 예시에는 사용자가 실제로 입력한 요청(Before)과 에이전트가 이를 변환해 실제로 사용한 정교한 프롬프트(After)를 함께 배치했습니다.</b></p>
      </div>
    </div>
    ${F.replace('{PART}','Part 2.  따라하기')}
  </div></div>`},

      <p class="edit" contenteditable="true">기술은 계속 바뀌지만, 좋은 콘텐츠의 본질은 변하지 않습니다. AI를 잘 쓰는 것보다 <strong>무엇을, 왜, 누구를 위해 만드는지</strong>를 먼저 정리하는 습관이 결국 결과를 만듭니다.</p>
    </div>
  </div></div>`},

{id:'end',part:3,label:'닫는 페이지',html:`
  <div class="slide end-slide"><div class="slide-inner" style="align-items:center;justify-content:center">
    <div class="logo edit" contenteditable="true">강의자료</div>
    <div class="tag edit" contenteditable="true">Create Anything</div>
    <div class="copyright edit" contenteditable="true">© 2026 강의자료<br>본 자료의 전부 또는 일부를 무단으로 복제, 배포, 전송하는 것은 저작권법에 의해 금지됩니다.</div>
  </div></div>`},
];

/* Case slide helper */
function caseSlide(o){
  const refs = o.refs && o.refs.length ? `
    <div class="refs">${o.refs.map(r=>`<img src="${IMG}${r}" alt="reference">`).join('')}</div>` : '';
  return `<div class="slide"><div class="slide-inner">
    <div class="case-layout">
      <img class="case-main-img" src="${IMG}${o.main}" alt="${o.title}">
      <div class="case-body">
        <h3 class="edit" contenteditable="true">${o.title}</h3>
        <div class="kv edit" contenteditable="true"><b>사용 모델:</b> ${o.model}</div>
        <h4 class="edit" contenteditable="true">사용자 요청(Before):</h4>
        ${refs}
        <p class="prompt-user edit" contenteditable="true">${o.before}</p>
        <h4 class="edit" contenteditable="true" style="color:var(--slide-link)">변환된 프롬프트(After):</h4>
        <p class="prompt-ai edit" contenteditable="true">${o.after}</p>
      </div>
    </div>
    ${F.replace('{PART}','Part 2.  따라하기')}
  </div></div>`;
}

/* Company slide helper */
function companySlide(o){
  return `<div class="slide"><div class="slide-inner">
    <div class="company-layout">
      <div class="company-body">
        <h1 class="edit" contenteditable="true">${o.title}</h1>
        <div class="quote edit" contenteditable="true">${o.quote}</div>
        ${o.paragraphs.map(p=>`<p class="edit" contenteditable="true">${p}</p>`).join('')}
      </div>
      <div class="company-imgs ${o.grid}">
        ${o.imgs.map(i=>`<img src="${IMG}${i}" alt="">`).join('')}
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  도입하기')}
  </div></div>`;
}

/* ==================== Rendering & state ==================== */
const PART_META = {0:{num:'',label:'Overview'},1:{num:'Part 1',label:'이해하기'},2:{num:'Part 2',label:'따라하기'},3:{num:'Part 3',label:'도입하기'}};
const STORAGE_KEY = 'ai-content-book-edits-v2';

function loadEdits(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return{}}}
function saveEdits(edits){localStorage.setItem(STORAGE_KEY,JSON.stringify(edits))}

function renderNav(){
  const nav=document.getElementById('nav');
  let html='';let curPart=-1;
  SLIDES.forEach((s,i)=>{
    if(s.part!==curPart){
      if(curPart!==-1) html+=`</ul></div>`;
      curPart=s.part;const meta=PART_META[curPart];
      html+=`<div class="nav-part"><div class="part-header"><span>${meta.label}</span>${meta.num?`<span class="part-num">${meta.num}</span>`:''}</div><ul class="nav-list">`;
    }
    html+=`<li class="nav-item" data-id="${s.id}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span>${s.label}</span></li>`;
  });
  html+='</ul></div>';
  nav.innerHTML=html;
  nav.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',()=>selectSlide(item.dataset.id));
  });
}

let currentSlideId=null;
function selectSlide(id){
  const slide=SLIDES.find(s=>s.id===id);
  if(!slide) return;
  currentSlideId=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  const content=document.getElementById('content');
  content.innerHTML=slide.html;
  applyEdits(id);wireEditables(id);
  window.scrollTo({top:0,behavior:'smooth'});
  if(location.hash!=='#'+id) history.replaceState(null,'',`#${id}`);
  document.querySelector('.sidebar').classList.remove('open');
}

function applyEdits(id){
  const edits=loadEdits();const slideEdits=edits[id];
  if(!slideEdits) return;
  document.querySelectorAll('#content [contenteditable="true"]').forEach((el,idx)=>{
    if(slideEdits[idx]!==undefined) el.innerHTML=slideEdits[idx];
  });
}

function wireEditables(id){
  document.querySelectorAll('#content [contenteditable="true"]').forEach((el,idx)=>{
    el.addEventListener('input',()=>{
      const edits=loadEdits();
      if(!edits[id]) edits[id]={};
      edits[id][idx]=el.innerHTML;
      clearTimeout(el._t);
      el._t=setTimeout(()=>saveEdits(edits),400);
    });
  });
}

renderNav();
const hashId=location.hash.slice(1);
selectSlide(SLIDES.find(s=>s.id===hashId)?.id || SLIDES[0].id);
</script>
