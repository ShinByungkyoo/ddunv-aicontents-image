{id:'p3-ch7-why',part:3,label:'7장 · 글자는 왜 자주 깨지나',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">글자는 왜 자주 깨지나</h1></div>
    <div class="p3-cols">
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">그림으로 그리기 때문</div>
        <p class="p3-p edit" contenteditable="true">모델은 글자를 <b>문자로 입력하는 것이 아니라 그림으로 그립니다.</b> 그래서 획이 하나 빠지거나 비슷한 모양으로 뭉개지는 일이 생깁니다.</p>
        <p class="p3-p edit" contenteditable="true">영문과 숫자는 꽤 정확합니다. 짧은 단어라면 거의 틀리지 않습니다. 문제는 글자 수가 늘어날 때, 그리고 <b>한글일 때</b>입니다.</p>
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:10px">성공률을 올리는 조건</div>
        <ul class="p3-list">
          <li class="edit" contenteditable="true"><b>짧게</b> — 단어 하나나 두 개까지가 안전합니다</li>
          <li class="edit" contenteditable="true"><b>따옴표로 묶어서</b> — 정확히 이 글자라고 알려 줍니다</li>
          <li class="edit" contenteditable="true"><b>위치를 지정</b> — 어디에 놓을지 말해 줍니다</li>
          <li class="edit" contenteditable="true"><b>서체 성격을 지정</b> — 굵은 산세리프처럼</li>
        </ul>
      </div>
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">영문 텍스트 넣기</div>
        ${prompt_block('Poster design with the word "SUMMER"\nin large bold sans-serif letters across\nthe center. The text is white with a\nsubtle drop shadow, set against a photo\nof a sunlit beach. Clean layout with\ngenerous margins. Make sure the spelling\nis exactly "SUMMER".')}
        <p class="p3-p muted edit" contenteditable="true">마지막 문장을 붙이는 습관을 들이세요. 철자를 다시 확인하라는 지시가 오타를 눈에 띄게 줄입니다.</p>
        <div class="p3-note edit" contenteditable="true">글자가 많이 들어가야 한다면 이미지 모델로 해결하려 들지 마세요. <b>배경만 만들고 글자는 따로 얹는 편</b>이 언제나 빠르고 정확합니다.</div>
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  나노 바나나 프롬프트 사전')}
  </div></div>`},

{id:'p3-ch7-hangul',part:3,label:'7장 · 한글은 다르게 접근한다',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">한글은 다르게 접근한다</h1></div>
    <div class="p3-cols">
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">솔직한 현재 상황</div>
        <p class="p3-p edit" contenteditable="true">한글은 자음과 모음을 조합해 한 글자를 만드는 구조라, 모델이 그림으로 그릴 때 <b>획이 어긋나거나 없는 글자가 만들어지기</b> 쉽습니다. 짧은 단어는 성공하기도 하지만 안정적이라고 하기는 어렵습니다.</p>
        <p class="p3-p edit" contenteditable="true">그래서 실무에서는 한글을 이미지 안에 직접 생성하려 하지 않는 것이 정석입니다.</p>
      </div>
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">세 가지 우회법</div>
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:0">자리 비우기</div>
        <p class="p3-p edit" contenteditable="true">글자 들어갈 여백만 만들고 나중에 얹는다</p>
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:10px">영문·숫자만</div>
        <p class="p3-p edit" contenteditable="true">이미지에는 영문만, 한글은 후처리로</p>
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:10px">짧게 시도 후 검수</div>
        <p class="p3-p edit" contenteditable="true">두세 글자만 시도하고 반드시 확인</p>
        <div class="p3-note edit" contenteditable="true">굳이 이미지 안에 한글을 넣어야 한다면, 생성 후 반드시 한 글자씩 확대해 확인하세요. 얼핏 맞아 보여도 획이 틀린 경우가 많습니다.</div>
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  나노 바나나 프롬프트 사전')}
  </div></div>`},

{id:'p3-ch7-bg',part:3,label:'7장 · 배경만 만들고 글자는 나중에',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">배경만 만들고 글자는 나중에</h1></div>
    <div class="p3-cols">
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">가장 확실한 방법</div>
        <p class="p3-p edit" contenteditable="true">배경만 모델로 만들고, 글자는 디자인 도구에서 얹는 방식입니다. 이미지에 <b>글자 자리를 미리 비워 두라고</b> 지시하는 것이 요령입니다.</p>
        ${prompt_block("Create a background image for a Korean\nYouTube thumbnail: a bright kitchen\ncounter with fresh ingredients arranged\non the left side.\n\nLeave the entire right half of the frame\nvisually simple and low in contrast, with\nno objects or text, so that Korean text\ncan be placed there afterward.\n16:9 composition.")}
      </div>
      <div class="p3-col">
        <div class="p3-note edit" contenteditable="true">이 방식이 <b>실무 표준</b>입니다. 배경은 모델로, 글자는 캔바·미리캔버스·피그마로. 한글 서체도 마음대로 고를 수 있어 결과가 훨씬 낫습니다.</div>
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:12px">왜 후처리가 나은가</div>
        <ul class="p3-list">
          <li class="edit" contenteditable="true"><b>서체를 고를 수 있다</b> — 모델은 서체를 지정받지 못합니다</li>
          <li class="edit" contenteditable="true"><b>글자를 고쳐도 배경이 안 변한다</b> — 문구만 갈아 끼우면 됩니다</li>
          <li class="edit" contenteditable="true"><b>같은 배경으로 여러 안</b> — 카피 A/B 테스트가 쉬워집니다</li>
        </ul>
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  나노 바나나 프롬프트 사전')}
  </div></div>`},

{id:'p3-ch7-thumb',part:3,label:'7장 · 썸네일과 배너',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">썸네일과 배너</h1></div>
    <div class="p3-cols">
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">유튜브 썸네일 배경</div>
        ${prompt_block("YouTube thumbnail background, 16:9.\nA Korean man in his thirties on the left\nthird of the frame, facing the camera\nwith a surprised expression, pointing to\nhis right. Bright studio lighting, high\ncontrast, saturated colors.\n\nThe right two-thirds is a clean gradient\nbackground with no detail, reserved for\ntext. Strong subject separation from the\nbackground.")}
        <p class="p3-p muted edit" contenteditable="true">썸네일은 <b>대비와 채도</b>가 전부입니다. 작게 줄어들어도 알아볼 수 있어야 합니다.</p>
      </div>
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">상세페이지 배너</div>

        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:10px">규격 정리</div>
        <div class="p3-table">
          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">유튜브 썸네일</div><div class="v">16:9</div></div>
          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">인스타 피드</div><div class="v">1:1 또는 4:5</div></div>
          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">릴스·쇼츠 커버</div><div class="v">9:16</div></div>
          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">상세페이지 배너</div><div class="v">3:1 또는 2:1</div></div>
          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">블로그 대표</div><div class="v">16:9</div></div>
        </div>
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  나노 바나나 프롬프트 사전')}
  </div></div>`},

{id:'p3-ch7-check',part:3,label:'7장 · 텍스트 점검',html:`

    <div class="p3-cols">

        <div class="p3-sub edit" contenteditable="true">체크리스트</div>

          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">철자 고정</div><div class="v">spell it exactly as "[단어]"</div></div>

          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">단순 배경</div><div class="v">clean gradient, no detail</div></div>
          <div class="trow"><div class="k" style="font-family:'Noto Sans KR',sans-serif;font-size:12.5px">비율 지정</div><div class="v">[16:9 / 1:1 / 9:16] composition</div></div>

        <p class="p3-p muted edit" contenteditable="true" style="margin-top:8px">세 번째가 은근히 자주 쓰입니다. 시키지도 않은 글자가 배경에 멋대로 생겼을 때 이 한 줄로 지웁니다.</p>

{id:'p3-ch8-cover',part:3,label:'8장 · 안 될 때의 진단법',html:`

{id:'p3-ch8-order',part:3,label:'8장 · 고치는 순서',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">고치는 순서</h1></div>
    <div class="p3-cols">
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">위에서부터 짚는다</div>
        <p class="p3-p edit" contenteditable="true">결과가 어긋날 때 아무 데나 손대면 시간만 갑니다. <b>영향이 큰 것부터</b> 순서대로 확인하세요.</p>
        <ol class="p3-steps">
          <li class="edit" contenteditable="true">매체를 적었는가 (사진인가 그림인가)</li>
          <li class="edit" contenteditable="true">피사체가 구체적인가 (국적·나이·의상)</li>
          <li class="edit" contenteditable="true">조명과 앵글을 지정했는가</li>
          <li class="edit" contenteditable="true">요구가 너무 많지는 않은가</li>
          <li class="edit" contenteditable="true">편집으로 하나씩 바꿔 봤는가</li>
        </ol>
        <div class="p3-note edit" contenteditable="true">네 번째에서 대부분 걸립니다. <b>기본 장면을 먼저 만들고 편집으로 쌓으세요.</b></div>
      </div>
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">쪼개서 쌓기</div>
        ${prompt_block("// 1단계 - 기본 장면만\nA Korean woman standing in a modern\nkitchen, natural window light.\n\n// 2단계 - 편집으로 추가\nAdd a ceramic mug in her right hand.\nKeep everything else the same.\n\n// 3단계 - 편집으로 추가\nChange her outfit to a beige apron.\nKeep her face and pose unchanged.\n\n// 4단계 - 마무리 보정\nWarm up the overall color slightly.")}
        <p class="p3-p muted edit" contenteditable="true">네 번의 요청이 한 번의 긴 프롬프트보다 빠릅니다. 어느 단계에서 어긋났는지도 바로 보입니다.</p>
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  나노 바나나 프롬프트 사전')}
  </div></div>`},

{id:'p3-ch8-sym1',part:3,label:'8장 · 증상별 처방 · 하나',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">증상별 처방 · 하나</h1></div>
    <div class="p3-cols">
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">얼굴이 어색하다</div>
        <p class="p3-p edit" contenteditable="true">클로즈업일수록 심해집니다. 얼굴을 화면에서 작게 잡고, <b>natural skin texture</b>를 넣으세요. 그래도 이상하면 여러 장 뽑아 고르는 편이 빠릅니다.</p>
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:12px">손가락이 이상하다</div>
        <p class="p3-p edit" contenteditable="true">여전히 가장 자주 틀리는 부분입니다. 손을 <b>보이지 않게 하거나 단순한 자세</b>로 바꾸세요. 주머니에 넣기, 물건 쥐기, 팔짱 끼기가 안전합니다.</p>
        ${prompt_block("hands in pockets / holding a cup with\nboth hands / arms crossed",true)}
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:12px">글자가 깨진다</div>
        <p class="p3-p edit" contenteditable="true">7장을 참고하세요. 한글이라면 이미지 안에서 해결하려 들지 않는 것이 정답입니다.</p>
      </div>
      <div class="p3-col">
        <div class="p3-sub edit" contenteditable="true">요청한 게 빠졌다</div>
        <p class="p3-p edit" contenteditable="true">요구가 많으면 모델이 일부를 흘립니다. 빠진 것만 <b>편집으로 따로 추가</b>하세요.</p>
        ${prompt_block("Add the [빠진 것] that was missing.\nKeep everything else exactly the same.",true)}
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:12px">배경이 너무 산만하다</div>
        <p class="p3-p edit" contenteditable="true">배경을 흐리거나 단순하게 만들라고 지시하세요.</p>
        ${prompt_block("background heavily blurred, shallow\ndepth of field, minimal distractions",true)}
        <div class="p3-sub plain edit" contenteditable="true" style="margin-top:12px">색이 원하는 대로 안 나온다</div>
        <p class="p3-p edit" contenteditable="true">"파란색"보다 <b>muted navy</b>처럼 구체적인 색 이름이 정확합니다.</p>
      </div>
    </div>
    ${F.replace('{PART}','Part 3.  나노 바나나 프롬프트 사전')}
  </div></div>`},

{id:'p3-ch8-sym2',part:3,label:'8장 · 증상별 처방 · 둘',html:`
  <div class="slide"><div class="slide-inner">
    <div class="p3-title-wrap"><h1 class="p3-h1 edit" contenteditable="true">증상별 처방 · 둘</h1></div>

/* Case slide helper */
function caseSlide(o){
  const refs = o.refs && o.refs.length ? `
    <div class="refs">${o.refs.map(r=>`<img src="${IMG}${r}" alt="reference">`).join('')}</div>` : '';
  const beforeEn = o.beforeEn || '';
  const beforeBlock = beforeEn
    ? `<p class="prompt-user edit has-copy" contenteditable="true"><span class="lang lang-ko">${o.before}</span><span class="lang lang-en">${beforeEn}</span></p>`
    : `<p class="prompt-user edit has-copy" contenteditable="true">${o.before}</p>`;
  return `<div class="slide"><div class="slide-inner">
    <div class="case-layout">
      <img class="case-main-img" src="${IMG}${o.main}" alt="${o.title}">
      <div class="case-body">
        <h3 class="edit" contenteditable="true">${o.title}</h3>
        <div class="kv edit" contenteditable="true"><b>사용 모델:</b> ${o.model}</div>
        <h4 class="edit" contenteditable="true">사용자 요청(Before):</h4>
        ${refs}
        ${beforeBlock}
        <h4 class="edit" contenteditable="true" style="color:var(--slide-link)">변환된 프롬프트(After):</h4>
        <p class="prompt-ai edit has-copy" contenteditable="true">${o.after}</p>
      </div>
    </div>
    ${F.replace('{PART}','Part 2.  따라하기')}
  </div></div>`;
}

/* ==================== Rendering & state ==================== */
const PART_META = {1:{num:'Part 1',label:'이해하기'},2:{num:'Part 2',label:'따라하기'},3:{num:'Part 3',label:'나노 바나나 프롬프트 사전'}};
const STORAGE_KEY = 'ai-image-book-edits-v5';

function loadEdits(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return{}}}
function saveEdits(edits){localStorage.setItem(STORAGE_KEY,JSON.stringify(edits))}

function renderNav(){
  const nav=document.getElementById('nav');
  let html='';let curPart=-1;
  SLIDES.forEach((s,i)=>{
    if(s.part!==curPart){
      if(curPart!==-1) html+=`</ul></div>`;
      curPart=s.part;const meta=PART_META[curPart];
      html+=`<div class="nav-part"><div class="part-header"><span>${meta.label}</span>${meta.num?`<span class="part-num">${meta.num}</span>`:''}</div><ul class="nav-list">`;
    }
    html+=`<li class="nav-item" data-id="${s.id}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span>${s.label}</span></li>`;
  });
  html+='</ul></div>';
  nav.innerHTML=html;
  nav.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',()=>selectSlide(item.dataset.id));
  });
}

let currentSlideId=null;
function selectSlide(id){
  const slide=SLIDES.find(s=>s.id===id);
  if(!slide) return;
  currentSlideId=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));
  const content=document.getElementById('content');
  content.innerHTML=slide.html;
  applyEdits(id);
  applyEditMode();
  wireEditables(id);
  injectCopyButtons();
  window.scrollTo({top:0,behavior:'smooth'});
  if(location.hash!=='#'+id) history.replaceState(null,'',`#${id}`);
  document.querySelector('.sidebar').classList.remove('open');
}

function applyEdits(id){
  const edits=loadEdits();const slideEdits=edits[id];
  if(!slideEdits) return;
  document.querySelectorAll('#content [contenteditable]').forEach((el,idx)=>{
    if(slideEdits[idx]!==undefined) el.innerHTML=slideEdits[idx];
  });
}

function wireEditables(id){
  if(!editMode) return;
  document.querySelectorAll('#content [contenteditable="true"]').forEach((el,idx)=>{
    if(el._wired) return; el._wired=true;
    el.addEventListener('input',()=>{
      const edits=loadEdits();
      if(!edits[id]) edits[id]={};
      edits[id][idx]=el.innerHTML;
      clearTimeout(el._t);
      el._t=setTimeout(()=>saveEdits(edits),400);
    });
  });
}

/* ---------- Edit mode ---------- */
let editMode = sessionStorage.getItem('editMode')==='1';
function applyEditMode(){
  document.body.classList.toggle('edit-mode', editMode);
  document.querySelectorAll('#content [contenteditable]').forEach(el=>{
    el.setAttribute('contenteditable', editMode?'true':'false');
  });
  const lbl=document.getElementById('edit-lbl');
  const ico=document.getElementById('edit-ico');
  if(lbl){lbl.textContent = editMode?'잠금':'편집';}
  if(ico){ico.textContent = editMode?'🔓':'🔒';}
  const btn=document.getElementById('edit-btn');
  if(btn) btn.classList.toggle('active', editMode);
}
function setEditMode(on){
  editMode = on;
  sessionStorage.setItem('editMode', on?'1':'0');
  applyEditMode();
  if(on && currentSlideId) wireEditables(currentSlideId);
}

/* ---------- Login modal ---------- */
function openLogin(){
  const m=document.getElementById('login-mask');
  document.getElementById('login-id').value='';
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').textContent='';
  m.classList.add('open');
  setTimeout(()=>document.getElementById('login-id').focus(),50);
}
function closeLogin(){document.getElementById('login-mask').classList.remove('open');}
function tryLogin(){
  const id=document.getElementById('login-id').value.trim();
  const pw=document.getElementById('login-pw').value;
  if(id==='snownoon' && pw==='snownoon'){
    closeLogin();
    setEditMode(true);
  } else {
    document.getElementById('login-err').textContent='ID 또는 비밀번호가 올바르지 않습니다.';
  }
}
document.getElementById('edit-btn').addEventListener('click',()=>{
  if(editMode) setEditMode(false); else openLogin();
});
document.getElementById('login-ok').addEventListener('click',tryLogin);
document.getElementById('login-cancel').addEventListener('click',closeLogin);
document.getElementById('login-mask').addEventListener('click',(e)=>{
  if(e.target.id==='login-mask') closeLogin();
});
document.getElementById('login-pw').addEventListener('keydown',(e)=>{if(e.key==='Enter')tryLogin();});
document.getElementById('login-id').addEventListener('keydown',(e)=>{if(e.key==='Enter')document.getElementById('login-pw').focus();});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeLogin();});

/* ---------- Theme ---------- */
let theme = localStorage.getItem('theme') || 'dark';
function applyTheme(){
  document.body.classList.toggle('light', theme==='light');
  const lbl=document.getElementById('theme-lbl');
  const ico=document.getElementById('theme-ico');
  if(lbl){lbl.textContent = theme==='light'?'다크':'라이트';}
  if(ico){ico.textContent = theme==='light'?'☾':'☀';}
}
document.getElementById('theme-btn').addEventListener('click',()=>{
  theme = theme==='light'?'dark':'light';
  localStorage.setItem('theme',theme);
  applyTheme();
});

/* ---------- Language (Part 2 Before Ko/En toggle) ---------- */
let lang = localStorage.getItem('lang') || 'ko';
function applyLang(){
  document.body.setAttribute('data-lang', lang);
  const lbl=document.getElementById('lang-lbl');
  if(lbl) lbl.textContent = lang==='ko'?'EN':'KR';
  const btn=document.getElementById('lang-btn');
  if(btn) btn.classList.toggle('active', lang==='en');
}
document.getElementById('lang-btn').addEventListener('click',()=>{
  lang = lang==='ko'?'en':'ko';
  localStorage.setItem('lang',lang);
  applyLang();
});

/* ---------- Reset local edits ---------- */
document.getElementById('reset-btn').addEventListener('click',()=>{
  if(!confirm('로컬에 저장된 편집 내용을 모두 삭제하고 원본으로 되돌립니다. 계속하시겠습니까?')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
});

/* ---------- Copy button injection ---------- */
function injectCopyButtons(){
  document.querySelectorAll('#content .has-copy').forEach(el=>{
    if(el.querySelector(':scope > .copy-btn-inline')) return;
    const btn=document.createElement('button');
    btn.className='copy-btn-inline';
    btn.type='button';
    btn.textContent='복사';
    btn.setAttribute('contenteditable','false');
    btn.addEventListener('mousedown',e=>e.preventDefault());
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const clone=el.cloneNode(true);
      clone.querySelectorAll('.copy-btn-inline').forEach(b=>b.remove());
      const text=(clone.innerText||clone.textContent||'').trim();
      navigator.clipboard.writeText(text).then(()=>{
        btn.classList.add('ok');
        btn.textContent='복사됨!';
        setTimeout(()=>{btn.textContent='복사';btn.classList.remove('ok');},1400);
      }).catch(()=>{
        btn.textContent='실패';
        setTimeout(()=>{btn.textContent='복사';},1400);
      });
    });
    el.appendChild(btn);
  });
}

/* ---------- Init ---------- */
applyTheme();
applyLang();
renderNav();
const hashId=location.hash.slice(1);
selectSlide(SLIDES.find(s=>s.id===hashId)?.id || SLIDES[0].id);
</script>
